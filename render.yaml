# Render blueprint — deploys the API and serves the built React app from the
# same Express server (monolithic). Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: portfolio
    runtime: node
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/health
    buildCommand: npm --prefix client ci --include=dev && npm --prefix client run build && npm --prefix server ci
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_ORIGIN
        sync: false
      - key: SITE_URL
        sync: false
      - key: ADMIN_NAME
        value: Tauhidul Islam
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_USERNAME
        value: tofeeuqSoft
      - key: GITHUB_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_RECEIVER
        sync: false
    # Free plan: no persistent disk, so uploaded images/CV are written to the
    # container's disk and are lost on redeploy/restart. Add a `disk:` block
    # (paid plan) or move uploads to cloud storage (Cloudinary / R2) for
    # durable storage.
